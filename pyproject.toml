[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "agent-demo"
version = "0.1.0"
description = "A2A demo agents using PydanticAI and LangGraph"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "a2a-sdk",
    "pydantic-ai",
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-litellm",
]


[project.scripts]
ai4eosc-agent = "agent_demo.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["agent_demo*"]